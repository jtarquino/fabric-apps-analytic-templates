id: chat-with-your-data
name: Chat with your data
version: 1.0.0
services:
    auth:
        enabled: true
        fabric:
          enabled: true
        allowedRedirectUris:
            - http://localhost:5173
    data:
        enabled: false
    storage:
        enabled: false
    functions:
        enabled: true
        buildCommand: npm run build
    staticHosting:
        enabled: true
        folder: dist
        buildCommand: npm run build:fabric
        indexDocument: index.html